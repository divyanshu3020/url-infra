events {
    worker_connections 1024;
}

http {
    client_max_body_size 16k;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Internal Docker DNS
    upstream generation_backend {
        server generation_service:3000;
    }

    upstream redirection_backend {
        server redirection_service:3001;
    }

    server {
        listen 80;
        server_name _;

        # Client IP header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Write Path: Shorten URL -> Generation Service
        location /api/v1/shorten {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://generation_backend;
        }

        # Health check for Redirection Service
        location /redirect/health {
            proxy_pass http://redirection_backend/health;
        }

        # Health check for Generation Service
        location /generation/health {
            proxy_pass http://generation_backend/health;
        }

        # Read Path: Shortcode lookup & redirect -> Redirection Service
        location / {
            proxy_pass http://redirection_backend;
        }
    }
}