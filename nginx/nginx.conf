events {
    worker_connections 1024;
}

http {
    # Internal Docker DNS resolver
    upstream generation_backend {
        server generation_service:3000;
    }

    upstream redirection_backend {
        server redirection_service:3001;
    }

    server {
        listen 80;
        server_name _;

        # Client IP header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. Write Path: Shorten URL endpoint -> Generation Service
        location /short {
            proxy_pass http://generation_backend;
        }

        # 2. Read Path: Shortcode lookup & redirect -> Redirection Service
        location /redirect/ {
            proxy_pass http://redirection_backend;
        }
    }
}